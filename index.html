<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>the room — portfolio</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="loading-screen">
    <div class="loading-inner">
      <div class="loading-title">loading</div>
      <div class="loading-sub"></div>
    </div>
  </div>

  <div id="intro-overlay" class="hidden">
    <div class="menu-question">what do you want to do?</div>
    <div class="menu-options">
      <button id="flat-portfolio-btn" class="menu-option">flat portfolio</button>
      <button id="get-up-btn" class="menu-option">wake up</button>
    </div>
    <div id="menu-note" class="menu-note hidden">flat portfolio's coming soon — check back later.</div>
  </div>

  <div id="eyelid-top"></div>
  <div id="eyelid-bottom"></div>

  <div id="hint-bar">WASD to walk · drag to look around · click glowing items to zoom in</div>

  <canvas id="scene"></canvas>

  <!-- lightbox for viewing portfolio pieces -->
  <div id="lightbox" class="hidden">
    <div id="lightbox-backdrop"></div>
    <div id="lightbox-card">
      <button id="lightbox-close" aria-label="close">&times;</button>
      <button id="lightbox-prev" aria-label="previous">&#8249;</button>
      <div id="lightbox-media">
        <canvas id="lightbox-canvas"></canvas>
      </div>
      <button id="lightbox-next" aria-label="next">&#8250;</button>
      <div id="lightbox-info">
        <div id="lightbox-kicker"></div>
        <h2 id="lightbox-title"></h2>
        <p id="lightbox-desc"></p>
      </div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module" src="js/main.js"></script>
</body>
</html>
